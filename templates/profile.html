{% extends "base.html" %}
{% block content %}
<h1>My profile</h1>
<p>Username: {{ user.username }}</p>
<p>Name: {{ user.first_name }} {{ user.last_name }}</p>
<p>Email: {{ user.email }}</p>
<p>Contact number: {{ user.contact_number|default:"—" }}</p>
<p>Role: {{ user.get_role_display }}</p>
<a href="{% url 'profile_edit' %}">Edit profile</a>
{% endblock %}
