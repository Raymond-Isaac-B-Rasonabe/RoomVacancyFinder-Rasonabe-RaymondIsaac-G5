<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Classroom Vacancy Finder{% endblock %}</title>
<style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f7f4ea; color: #1f2a24; }
    nav { display: flex; gap: 1rem; align-items: center; padding: 0.75rem 1.5rem; background: #2f4f3e; }
    nav a { color: #f4f1e8; text-decoration: none; }
    nav .brand { margin-right: auto; font-weight: bold; }
    nav form { margin: 0; }
    main { max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; font-weight: bold; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 0.75rem; }
    button { padding: 0.5rem 1rem; border: 0; border-radius: 4px; background: #f2b705; cursor: pointer; }
    .errorlist { color: #c8402f; }
    .error { color: #c8402f; }
    .success { color: #2e7d4f; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">Classroom Finder</span>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard_redirect' %}">Dashboard</a>
      <a href="{% url 'profile' %}">Profile</a>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>
    {% else %}
      <a href="{% url 'login' %}">Log in</a>
      <a href="{% url 'signup' %}">Sign up</a>
    {% endif %}
  </nav>
  <main>
    {% for m in messages %}<p class="{{ m.tags }}">{{ m }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
