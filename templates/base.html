<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Vacancy Finder</title></head>
<body>
<nav>
  {% if user.is_authenticated %}
    <a href="{% url 'dashboard_redirect' %}">Dashboard</a>
    <a href="{% url 'profile' %}">Profile</a>
    <form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button>Log out</button></form>
  {% else %}
    <a href="{% url 'login' %}">Log in</a> <a href="{% url 'signup' %}">Sign up</a>
  {% endif %}
</nav>
{% for m in messages %}<p class="{{ m.tags }}">{{ m }}</p>{% endfor %}
{% block content %}{% endblock %}
</body></html>
